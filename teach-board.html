<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teach Board — live math</title>
<script>
  MathJax = {
    tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
    svg: { fontCache: 'global' }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#8b949e;--line:#30363d;
        --green:#3fb950;--yellow:#d29922;--red:#f85149;--blue:#58a6ff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.65;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #bar{position:sticky;top:0;background:rgba(13,17,23,.92);backdrop-filter:blur(6px);
       border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:14px;align-items:center;
       font-size:13px;color:var(--muted);z-index:10}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  #dot.stale{background:var(--muted);box-shadow:none}
  #wrap{max-width:820px;margin:0 auto;padding:8px 26px 120px}
  h1{font-size:27px;border-bottom:1px solid var(--line);padding-bottom:8px}
  h2{font-size:21px;margin-top:34px}
  h3{font-size:17px;color:var(--blue)}
  code{background:#0d1117;border:1px solid var(--line);padding:1px 6px;border-radius:5px;
       color:var(--yellow);font-size:.92em}
  pre{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto}
  pre code{border:0;color:var(--ink)}
  blockquote{border-left:3px solid var(--blue);margin:14px 0;padding:4px 16px;color:var(--muted);
             background:rgba(88,166,255,.06);border-radius:0 8px 8px 0}
  table{border-collapse:collapse;width:100%;margin:14px 0}
  td,th{border:1px solid var(--line);padding:9px 12px;text-align:left}
  th{color:var(--muted)}
  a{color:var(--blue)}
  hr{border:0;border-top:1px solid var(--line);margin:30px 0}
  mjx-container{color:var(--ink)}
  .err{color:var(--red);font-family:monospace;padding:20px}
</style>
</head>
<body>
<div id="bar"><span id="dot"></span><span id="status">watching teach-board.md …</span></div>
<div id="wrap"><div id="content"><p style="color:var(--muted)">Waiting for <code>teach-board.md</code> …</p></div></div>
<script>
const FILE='teach-board.md';
let last=null;
async function tick(){
  try{
    const r=await fetch(FILE+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok){throw new Error(r.status)}
    const txt=await r.text();
    document.getElementById('dot').classList.remove('stale');
    document.getElementById('status').textContent='live · '+FILE+' · '+txt.length+' chars';
    if(txt!==last){
      last=txt;
      document.getElementById('content').innerHTML=marked.parse(txt);
      if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetClear&&MathJax.typesetClear();await MathJax.typesetPromise();}
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    }
  }catch(e){
    document.getElementById('dot').classList.add('stale');
    document.getElementById('status').textContent='waiting for '+FILE+' (serve over http, not file://) — '+e;
  }
}
setInterval(tick,1000);tick();
</script>
</body>
</html>
